    x-enum-comments:
      DECLINED_CODE_ATM_LIMIT_EXCEEDED: Something went wrong when processing the transaction.
        Please contact Reap for support.
      DECLINED_CODE_BUDGET_FROZEN: The budget associated with this card has been frozen.
        Please contact Reap.
      DECLINED_CODE_BUDGET_INSUFFICIENT_FUNDS: Insufficient funds in the budget associated
        with this card. Please contact your Admin.
      DECLINED_CODE_CARD_BLOCKED: The card is blocked.
      DECLINED_CODE_CARD_DESTROYED: The card has been destroyed.
      DECLINED_CODE_CARD_EXPIRED: The card has expired. Please use a valid card.
      DECLINED_CODE_CARD_FROZEN: Cardholder has frozen the card.
      DECLINED_CODE_CARD_NOT_ACTIVATED: The card is not activated yet. Please activate
        it from the Reap mobile app or the Reap Dashboard.
      DECLINED_CODE_CARD_STATUS_LOST: The card's status is lost.
      DECLINED_CODE_CATEGORY_INSUFFICIENT_FUNDS: Not enough balance to complete the
        transaction for this merchant category. Please add funds.
      DECLINED_CODE_DAILY_SPENDING_LIMIT_EXCEEDED: The daily ceiling allowed to spend
        for this card has been exceeded. Please contact your Admin.
      DECLINED_CODE_DECLINED_BY_CLIENT: Transaction declined by client or The system
        has timed out.
      DECLINED_CODE_EXCEEDING_CVV_ATTEMPTS: The card has been blocked due to exceeding
        the maximum number of incorrect CVV transaction attempts.
      DECLINED_CODE_EXCEEDING_EXPIRY_DATE_ATTEMPTS: The card has been blocked due
        to exceeding the maximum number of incorrect expiry date transaction attempts.
      DECLINED_CODE_EXCEEDING_PIN_ATTEMPTS: The card has been blocked due to exceeding
        the maximum number of incorrect ATM PIN attempts.
      DECLINED_CODE_INCORRECT_PIN: The entered PIN is incorrect. Please try again.
      DECLINED_CODE_INSUFFICIENT_FUNDS: Insufficient funds.
      DECLINED_CODE_INSUFFICIENT_FUNDS_REAL_TIME: Insufficient funds.
      DECLINED_CODE_INVALID_CARD_NUMBER: The card number is invalid, and your terminal
        is having trouble finding the relevant account.
      DECLINED_CODE_INVALID_CARD_STATUS: Invalid card status. Please contact the issuer.
      DECLINED_CODE_INVALID_CVV: The CVV entered is incorrect. Please check and try
        again.
      DECLINED_CODE_ISSUER_INOPERATIVE: Issuer or switch is inoperative.
      DECLINED_CODE_ISSUER_NOT_PARTICIPATE: The issuer does not participate in that
        merchant category.
      DECLINED_CODE_MERCHANT_NOT_ACCEPT_CARD: The merchant is not set up to accept
        this type of card. Please try using a different payment method.
      DECLINED_CODE_OK: OK
      DECLINED_CODE_PIN_VERIFICATION_FAILED: The system was unable to verify your
        PIN due to a technical issue or incorrect input.
      DECLINED_CODE_POS_TRANSACTION_NOT_ALLOWED: The transaction is not allowed at
        this point of sale.
      DECLINED_CODE_PROCESSING_ERROR: Something went wrong when processing the transaction.
        Please contact Reap for support.
      DECLINED_CODE_SPENDING_FREQUENCY_EXCEEDED: The spending frequency allowed for
        this card has been exceeded. Please contact your Admin.
      DECLINED_CODE_TRANSACTION_NOT_PERMITTED: Transaction is not permitted to the
        cardholder
      DECLINED_CODE_TRANSACTION_RECORD_DISCREPANCY: There's a discrepancy between
        the transaction records of the payment systems involved.
      DECLINED_CODE_TRANSACTION_TIMEOUT: Transaction took too long to process, please
        try again.
      DECLINED_CODE_UNEXPECTED_ERROR: An unexpected error happened before the payment
        could be fully processed.
      DECLINED_CODE_VERIFICATION_FAILED: Verification of the provided data failed.
        Please verify and try again.
      DECLINED_CODE_WITHDRAWAL_AMOUNT_LIMIT_EXCEEDED: The ATM withdrawal amount limit
        has been exceeded.
      DECLINED_CODE_WITHDRAWAL_FREQUENCY_EXCEEDED: The ATM withdrawal frequency has
        been exceeded.
      DECLINED_CODE_WITHDRAWAL_NOT_ALLOWED: Withdrawals are not allowed for this card.
      DECLINED_CODE_WITHDRAWAL_NOT_PERMITTED: ATM withdrawal is not permitted in the
        merchant's country.
