services: 
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: easy_vault_api
    environment:
      CONFIG_FILE: /app/.env
    # volumes:
    #   - ./.env:/app/.env.docker:ro
    ports:
      - "8082:8081"
      - "9444:9443"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: easy_vault_mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: easy_vault
    ports:
      - "3312:3306"
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    # volumes:
    #   - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: easy_vault_redis
    command: ["redis-server", "--requirepass", "123456"]
    ports:
      - "6380:6379"
    # volumes:
    #   - redis_data:/data
    restart: unless-stopped

